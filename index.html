    <title>Расписание</title>
    <style>html,body{background:#f7f7f5;min-height:100%;margin:0}#boot-splash{box-sizing:border-box;text-align:center;color:#fff;background:radial-gradient(circle at 50% 34%,#2a5a8f 0%,#184271 42%,#0c2544 100%);flex-direction:column;justify-content:center;align-items:center;gap:20px;min-height:100dvh;padding:32px 20px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex}#boot-splash img{object-fit:cover;box-sizing:border-box;background:#fff;border-radius:50%;width:128px;height:128px;padding:6px;box-shadow:0 18px 48px #0006,0 0 0 1px #ffffff80}#boot-splash strong{letter-spacing:.02em;font-size:23px;font-weight:800;display:block}#boot-splash span{color:#e2eeffc7;margin-top:4px;font-size:13px;font-weight:500;display:block}html.boot-skip-splash #boot-splash{display:none!important}html.boot-skip-splash,html.boot-skip-splash body{background:#f7f7f5}html[data-theme=dark].boot-skip-splash,html[data-theme=dark].boot-skip-splash body{background:#12151a}</style>
    <!-- Синхронно ДО body: решает мигание заставки при обновлении -->
    <script src="/chuikov-rasp/boot-gate.js?v=95"></script>
    <script type="module" crossorigin src="/chuikov-rasp/assets/index-CpLFHf3E.js"></script>
    <link rel="stylesheet" crossorigin href="/chuikov-rasp/assets/index-dfrcf7PG.css">
  </head>
  <body>
    <div id="app">
      <div id="boot-splash" role="status" aria-live="polite">
        <img src="/chuikov-rasp/college-logo.jpg" alt="" width="128" height="128" />
        <div>
          <strong>Расписание</strong>
          <span>Колледж им. В.И. Чуйкова</span>
        </div>
      </div>
    </div>
    <script>
      /* Если JS не поднялся (битый SW-кэш) — кнопка обновить вместо вечной заставки */
      setTimeout(function () {
        try {
          if (window.__RASP_BOOTED__) return
          var app = document.getElementById('app')
          if (!app || !app.querySelector('#boot-splash')) return
          app.innerHTML =
            '<div style="padding:48px 20px;text-align:center;font-family:system-ui,sans-serif">' +
            '<p style="margin:0 0 16px">Не загрузилось. Нажмите «Обновить».</p>' +
            '<button type="button" onclick="location.reload()" style="font-size:16px;padding:10px 20px;border-radius:10px;border:0;background:#1a1a1a;color:#fff">Обновить</button>' +
            '</div>'
        } catch (e) {}
      }, 10000)
    </script>
  </body>
