name: Deploy to GitHub Pages

# Сборка и публикация сайта при пуше в main.
#
# Почему публикуем в ветку gh-pages, а не через actions/deploy-pages:
# в настройках репозитория источник Pages — ветка gh-pages, а у окружения
# github-pages политика веток разрешает деплой только из неё. Job deploy
# при публикации из main падал за пару секунд без единого шага.
# Поэтому здесь повторяем то, что делает `npm run deploy` (gh-pages -d dist):
# собираем и force-пушим содержимое dist в gh-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # anon key и адреса Supabase публичны по своей природе —
          # они и так лежат в собранном бандле на сайте.
          VITE_SUPABASE_URL: https://rasp-supabase-proxy.tourmaline-purchase.workers.dev
          VITE_SUPABASE_PROXY_URL: https://rasp-supabase-proxy.tourmaline-purchase.workers.dev
          VITE_SUPABASE_DIRECT_URL: https://azuergqxvqrkvrvqelha.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_P8IdY1FtCrCroY4U2WSnMA_po0mrcJt
        run: npx vite build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
