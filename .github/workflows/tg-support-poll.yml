# Telegram support bot — работает на GitHub, без своего сервера.
#
# Почему так, а не «просто cron каждые 5 минут»:
#
# GitHub сильно троттлит schedule. По факту «*/5 * * * *» срабатывает
# 3–4 раза в день, интервалы доходили до 9,6 часа (проверено по истории
# запусков). То есть бот был мёртв почти всё время: человек пишет,
# а прочитать некому.
#
# Лимит одного job'а — 6 часов (жёсткое ограничение GitHub).
# Поэтому каждый запуск держит бота 5ч40м, а в конце САМ запускает
# следующий. Цепочка не рвётся, cron нужен только как страховка,
# если цепочка когда-нибудь оборвётся.
#
# Для публичного репозитория минуты Actions бесплатны.
name: tg-support-poll
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Сколько минут держать бота на связи (340 = 5ч40м)'
        required: false
        default: '340'
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: tg-support-poll
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll Telegram bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_MINUTES: ${{ github.event.inputs.minutes }}
        run: node scripts/tg-support-poll.mjs --minutes=${RUN_MINUTES:-340}

      # Продолжить цепочку. Только при успехе: если бот упал (например,
      # токен отозвали), нет смысла плодить запуски — пусть ждёт cron
      # и шумит в логах, пока проблему не заметят.
      - name: Keep the bot online (start next run)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Запускаю следующее звено цепочки…"
          curl -sS -o /tmp/resp.json -w 'HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tg-support-poll.yml/dispatches" \
            -d '{"ref":"main","inputs":{"minutes":"340"}}'
          cat /tmp/resp.json || true
