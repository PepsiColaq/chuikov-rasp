# Telegram support bot — runs on GitHub (no local PC needed)
#
# Почему job живёт почти 6 часов, а не 4,5 минуты:
# GitHub сильно троттлит schedule — «каждые 5 минут» на деле срабатывает
# 3–4 раза в день. При коротком job'е бот был мёртв почти всё время:
# сообщение приходило, а прочитать его было некому до следующего запуска.
#
# Лимит одного job'а — 6 часов (жёсткое ограничение GitHub). Поэтому
# берём 5ч40м: почти всё время бот на связи. Следующий запуск встаёт
# в очередь (concurrency) и подхватывает сразу после текущего.
# Для публичного репозитория минуты Actions бесплатны.
name: tg-support-poll
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: tg-support-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll Telegram bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/tg-support-poll.mjs --minutes=340
