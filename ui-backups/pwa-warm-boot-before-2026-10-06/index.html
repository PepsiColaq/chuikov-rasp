<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co https://*.workers.dev blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.workers.dev wss://*.workers.dev; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="theme-color" content="#1b3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Расписание" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/chuikov-rasp/manifest.webmanifest?v=14" />
    <link rel="apple-touch-icon" href="/chuikov-rasp/apple-touch-icon-v14.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/chuikov-rasp/icon-v14-192.png" />
    <link rel="icon" type="image/svg+xml" href="/chuikov-rasp/favicon.svg?v=14" />
    <link rel="preload" as="image" href="/chuikov-rasp/college-logo.jpg" />
    <meta
      name="description"
      content="Расписание групп колледжа им. В. И. Чуйкова — неофициальный студенческий ресурс"
    />
    <title>Расписание</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f7f7f5; }
      /* Сразу правильная ширина — без мигания «телефон → ПК» до styles.css.
         Одна переменная для #app и нижней .nav (иначе нав шире колонки). */
      :root { --app-max: 480px; }
      @media (min-width: 768px) { :root { --app-max: 680px; } }
      @media (min-width: 1024px) { :root { --app-max: 1080px; } }
      @media (min-width: 1280px) { :root { --app-max: 1180px; } }
      #app,
      html.is-desktop #app {
        max-width: var(--app-max);
        margin: 0 auto;
        min-height: 100dvh;
        box-sizing: border-box;
      }
      /* Первый вход: брендовая заставка из HTML, пока грузится JS */
      #boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px 20px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
        color: #fff;
        background: radial-gradient(circle at 50% 34%, #2a5a8f 0%, #184271 42%, #0c2544 100%);
      }
      #boot-splash img {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        object-fit: cover;
        padding: 6px;
        box-sizing: border-box;
        background: #fff;
        box-shadow: 0 18px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.5);
      }
      #boot-splash strong {
        display: block;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      #boot-splash span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: rgba(226,238,255,0.78);
        font-weight: 500;
      }
      /* F5 / уже были на сайте: не показывать заставку ни на кадр */
      html.boot-skip-splash #boot-splash {
        display: none !important;
      }
      html.boot-skip-splash,
      html.boot-skip-splash body {
        background: #f7f7f5;
      }
      html[data-theme='dark'].boot-skip-splash,
      html[data-theme='dark'].boot-skip-splash body {
        background: #12151a;
      }
    </style>
    <!-- Синхронно ДО body: решает мигание заставки при обновлении -->
    <script src="/chuikov-rasp/boot-gate.js?v=112"></script>
  </head>
  <body>
    <div id="app">
      <div id="boot-splash" role="status" aria-live="polite">
        <img src="/chuikov-rasp/college-logo.jpg" alt="" width="128" height="128" />
        <div>
          <strong>Расписание</strong>
          <span>Колледж им. В.И. Чуйкова</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      /* Если JS не поднялся (битый SW-кэш) — кнопка обновить вместо вечной заставки */
      setTimeout(function () {
        try {
          if (window.__RASP_BOOTED__) return
          var app = document.getElementById('app')
          if (!app || !app.querySelector('#boot-splash')) return
          app.innerHTML =
            '<div style="padding:48px 20px;text-align:center;font-family:system-ui,sans-serif">' +
            '<p style="margin:0 0 16px">Не загрузилось. Нажмите «Обновить».</p>' +
            '<button type="button" onclick="location.reload()" style="font-size:16px;padding:10px 20px;border-radius:10px;border:0;background:#1a1a1a;color:#fff">Обновить</button>' +
            '</div>'
        } catch (e) {}
      }, 7000)
    </script>
  </body>
</html>
